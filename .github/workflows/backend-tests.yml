name: Backend API Tests

on:
  push:
    branches: [main, security/provider-evidence-guard, security/admin-auth-audit-log]
  pull_request:
    branches: [main, security/provider-evidence-guard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test
